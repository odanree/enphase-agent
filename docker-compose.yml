# Observability stack: agent (exports /metrics) + Prometheus (pulls) +
# Grafana (reads Prometheus). Read/write path separation by construction:
# Grafana and Prometheus only ever READ — battery writes still flow
# exclusively through the CLI + policy layer, so a compromised dashboard
# cannot drain the reserve.
#
#   docker compose up -d          # daemon + Prometheus + Grafana
#   docker compose run --rm enphase-agent status        # one-shots still work
#   docker compose run --rm enphase-agent set-mode savings --reason "off-peak"

services:
  enphase-agent:
    build: .
    image: enphase-agent:local
    container_name: enphase-agent
    env_file: .env
    environment:
      TZ: America/Los_Angeles
      ENPHASE_DB_PATH: /data/enphase.db
    volumes:
      - enphase_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      # Slim image has no curl; stdlib urllib is the zero-dependency probe.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    # Config file is a BIND mount (read-only) and that's fine — the fcntl
    # lock-forwarding bug only bites lock-hungry databases (SQLite, and
    # Prometheus's own TSDB below). A read-only YAML has no locks to lose.
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    # Hot-storage-only long retention: 1y of raw 15s samples, no
    # downsampling. At this cardinality (~40 series) that's roughly 1 GB/yr
    # — trivial for a home tool. If cardinality ever explodes, this is where
    # a Thanos/Mimir sidecar would take over with downsampled cold storage.
    # --web.enable-lifecycle turns on POST /-/reload so recording-rule
    # iterations don't need a container restart.
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.retention.time=1y",
        "--web.enable-lifecycle",
      ]
    ports:
      # Exposed so you can poke PromQL at http://<host>:9090 while learning.
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      # Default is admin/change_me from .env — change it before this ever
      # leaves the LAN (Grafana auth is the only gate on port 3000).
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-change_me}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

# All three stay NAMED volumes inside Docker's storage layer — SQLite,
# Prometheus TSDB, and Grafana's grafana.db all use fcntl-style locks that
# Docker Desktop's virtiofs / WSL2's 9P do not forward reliably, so a
# host bind mount pseudo-locks them the moment the host touches a file.
volumes:
  enphase_data:
  prometheus_data:
  grafana_data:
